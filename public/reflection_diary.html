                                </section>

                                {/* 02 — Self-Assessment */}
                                <section ref={refMap.self} className="mb-14 scroll-mt-10">
                                    <SectionEyebrow no="02" label="Self-Assessment" accent={tokens.dusk} accentDark={tokens.duskDark} />
                                    <p className="text-sm mb-7" style={{ color: tokens.inkSoft }}>
                                        Rate yourself, 1 to 5, against the six capstone competencies.
                                    </p>

                                    <div className="grid gap-4 sm:grid-cols-2">
                                        {competencies.map((c) => (
                                            <div
                                                key={c.key}
                                                className="rounded-lg p-4"
                                                style={{ backgroundColor: tokens.parchmentWarm, border: `1px solid ${tokens.rule}` }}
                                            >
                                                <div className="flex items-center justify-between mb-3">
                                                    <span className="text-sm font-medium" style={{ color: tokens.ink }}>
                                                        {c.label}
                                                    </span>
                                                    <span
                                                        className="text-xs px-2 py-0.5 rounded font-medium"
                                                        style={{ fontFamily: "'IBM Plex Mono', monospace", backgroundColor: "rgba(92,122,147,0.12)", color: tokens.duskDark }}
                                                    >
                                                        {scores[c.key]} / 5
                                                    </span>
                                                </div>
                                                <input
                                                    type="range"
                                                    min={1}
                                                    max={5}
                                                    step={1}
                                                    value={scores[c.key]}
                                                    onChange={(e) => setScores((s) => ({ ...s, [c.key]: Number(e.target.value) }))}
                                                    className="diary-slider"
                                                    style={{ "--thumb": tokens.dusk, "--track": tokens.rule }}
                                                />
                                                <div className="flex justify-between mt-1.5">
                                                    {[1, 2, 3, 4, 5].map((n) => (
                                                        <span key={n} className="text-xs font-mono" style={{ color: "#A9A48F" }}>
                                                            {n}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="no-print mt-6 flex items-center gap-4 flex-wrap">
                                        <button
                                            onClick={handleSaveSelfScores}
                                            className="flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition hover:brightness-110"
                                            style={{ backgroundColor: tokens.dusk, color: tokens.parchmentWarm }}
                                        >
                                            Save Scores
                                        </button>
                                        {selfSaveStatus === "saved" && (
                                            <span className="text-xs font-medium" style={{ color: tokens.sageDark, fontFamily: "'IBM Plex Mono', monospace" }}>
                                                ✓ Scores saved — radar chart updated.
                                            </span>
                                        )}
                                        {selfSaveStatus && selfSaveStatus.startsWith("error:") && (
                                            <span className="text-xs font-medium" style={{ color: tokens.wineDark, fontFamily: "'IBM Plex Mono', monospace" }}>
                                                ✕ {selfSaveStatus.replace("error: ", "")}
                                            </span>
                                        )}
                                    </div>
                                </section>

                                {/* 03 — Assessor Feedback */}
                                <section
                                    ref={refMap.assessor}
                                    className="mb-14 rounded-xl p-6 md:p-8 scroll-mt-10"
                                    style={{ backgroundColor: tokens.sagePanel, border: `1px solid ${tokens.sage}`, boxShadow: "0 4px 16px rgba(63,90,69,0.08)" }}
                                >
                                    <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
                                        <div className="flex items-center gap-2 flex-wrap">   
                                        <SectionEyebrow no="03" label="Supervisor / Assessor Feedback" accent={tokens.sage} accentDark={tokens.sageDark} />
                                            {assessmentStatus && (
                                                <span
                                                    className="text-xs font-medium px-2.5 py-1 rounded-full"
                                                    style={assessmentStatus === "assessed"
                                                        ? { backgroundColor: tokens.sage, color: tokens.parchmentWarm }
                                                        : { backgroundColor: tokens.brassTint, color: tokens.brassDark, border: `1px solid ${tokens.brass}` }}
                                                >
                                                    {assessmentStatus === "assessed" ? "Assessed" : "Pending assessment"}
                                                </span>
                                            )}
                                        </div>
                                        {isAssessor && (
                                            <button
                                                onClick={() => setIsAssessorReadOnly(!isAssessorReadOnly)}
                                                className="no-print flex items-center gap-1.5 text-xs font-medium px-2.5 py-1 rounded-full transition hover:bg-black/5"
                                                style={{ backgroundColor: tokens.parchmentWarm, color: tokens.sageDark, border: `1px solid ${tokens.sage}` }}
                                            >
                                                {isAssessorReadOnly ? <Lock size={12} /> : <Unlock size={12} />}
                                                {isAssessorReadOnly ? "Locked (Read-only)" : "Supervisor Edit Mode"}
                                            </button>
                                        )}
                                    </div>

                                    {!isAssessor ? (
                                        // Sprint 5 (per chị Lan's feedback): a student account can
                                        // see this tab, but can't edit or submit it — only an
                                        // "assessor" account can. No scores are shown at all, so
                                        // there's nothing misleading to look at.
                                        <div
                                            className="flex items-center gap-2.5 rounded-lg px-4 py-4 mt-2"
                                            style={{ backgroundColor: tokens.parchmentWarm, border: `1px dashed ${tokens.sage}` }}
                                        >
                                            <Lock size={14} style={{ color: tokens.sageDark, flexShrink: 0 }} />
                                            <p className="text-sm font-medium" style={{ color: tokens.sageDark }}>
                                                Only assessors can submit this section.
                                            </p>
                                        </div>
                                    ) : (
                                        <>
                                            <p className="text-sm mb-6" style={{ color: tokens.sageDark }}>
                                                {isAssessorReadOnly
                                                    ? "Completed by your supervisor or employer — read-only view."
                                                    : "For supervisor or employer: rate the student, 1 to 5, across the six competencies."}
                                            </p>

                                            <div className="grid gap-4 sm:grid-cols-2">
                                                {competencies.map((c) => {
                                                    const val = assessorScores[c.key];
                                                    return (
                                                        <div
                                                            key={c.key}
                                                            className="rounded-lg p-4"
                                                            style={{ backgroundColor: tokens.parchmentWarm, border: `1px solid rgba(124,148,132,0.35)` }}
                                                        >
                                                            <div className="flex items-center justify-between mb-3">
                                                                <span className="text-sm font-medium" style={{ color: tokens.ink }}>
                                                                    {c.label}
                                                                </span>
                                                                <span
                                                                    className="text-xs px-2 py-0.5 rounded font-medium"
                                                                    style={{ fontFamily: "'IBM Plex Mono', monospace", backgroundColor: "rgba(63,90,69,0.12)", color: tokens.sageDark }}
                                                                >
                                                                    {val} / 5
                                                                </span>
                                                            </div>

                                                            {isAssessorReadOnly ? (
                                                                <div className="w-full h-2 rounded-full my-2" style={{ backgroundColor: "#D9DFD3" }}>
                                                                    <div className="h-2 rounded-full transition-all duration-300" style={{ width: `${(val / 5) * 100}%`, backgroundColor: tokens.sage }} />
                                                                </div>
                                                            ) : (
                                                                <>
                                                                    <input
                                                                        type="range"
                                                                        min={1}
                                                                        max={5}
                                                                        step={1}
                                                                        value={val}
                                                                        onChange={(e) => setAssessorScores((s) => ({ ...s, [c.key]: Number(e.target.value) }))}
                                                                        className="diary-slider"
                                                                        style={{ "--thumb": tokens.sageDark, "--track": "rgba(124,148,132,0.35)" }}
                                                                    />
                                                                    <div className="flex justify-between mt-1.5">
                                                                        {[1, 2, 3, 4, 5].map((n) => (
                                                                            <span key={n} className="text-xs font-mono" style={{ color: "#9BAF9E" }}>
                                                                                {n}
                                                                            </span>
                                                                        ))}
                                                                    </div>
                                                                </>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>

                                            {!isAssessorReadOnly && (
                                                <div className="no-print mt-6 flex items-center gap-4 flex-wrap">
                                                    <button
                                                        onClick={handleSaveAssessorScores}
                                                        className="flex items-center gap-2 px-4 py-2 rounded-md text-sm font-medium transition hover:brightness-110"
                                                        style={{ backgroundColor: tokens.sageDark, color: tokens.parchmentWarm }}
                                                    >
                                                        Save Assessor Scores
                                                    </button>
                                                    {assessorSaveStatus === "saved" && (
                                                        <span className="text-xs font-medium" style={{ color: tokens.sageDark, fontFamily: "'IBM Plex Mono', monospace" }}>
                                                            ✓ Assessor scores saved — radar chart updated.
                                                        </span>
                                                    )}
                                                    {assessorSaveStatus && assessorSaveStatus.startsWith("error:") && (
                                                        <span className="text-xs font-medium" style={{ color: tokens.wineDark, fontFamily: "'IBM Plex Mono', monospace" }}>
                                                            ✕ {assessorSaveStatus.replace("error: ", "")}
                                                        </span>
                                                    )}
                                                </div>
                                            )}
                                        </>
                                    )}
                                </section>

                                {/* 04 — Progress Overview (Active Radar Chart) */}
                                <section ref={refMap.progress} className="scroll-mt-10">
                                    <SectionEyebrow no="04" label="Progress Overview" accent={tokens.wine} accentDark={tokens.wineDark} />
                                    <p className="text-sm mb-7" style={{ color: tokens.inkSoft }}>
                                        Self vs. assessor scores across all six competencies.
                                    </p>

                                    <div
                                        className="mx-auto rounded-xl relative"
                                        style={{
                                            border: `1px solid ${tokens.wine}55`,
                                            backgroundColor: tokens.parchmentWarm,
                                            boxShadow: "0 4px 16px rgba(140,91,98,0.08)",
                                            maxWidth: 520,
                                            padding: 24,
                                        }}
                                    >
                                        <div className="flex items-center justify-center gap-6 mb-4">
                                            <span className="flex items-center gap-1.5 text-xs font-medium" style={{ color: tokens.duskDark }}>
                                                <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: tokens.dusk }} />
                                                Self-Assessment
                                            </span>
                                            {assessorHasSubmitted && (
                                                <span className="flex items-center gap-1.5 text-xs font-medium" style={{ color: tokens.sageDark }}>
                                                    <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: tokens.sageDark }} />
                                                    Assessor / Supervisor
                                                </span>
                                            )}
                                        </div>

                                        <div style={{ height: 320 }} className="relative">
                                            <RadarChart
                                                selfScores={savedSelfScores}
                                                assessorScores={savedAssessorScores}
                                                competencies={competencies}
                                                tokens={tokens}
                                                showAssessor={assessorHasSubmitted}
                                            />
                                        </div>
                                        {!assessorHasSubmitted && (
                                            <p
                                                className="no-print text-xs text-center mt-1"
                                                style={{ fontFamily: "'IBM Plex Mono', monospace", color: tokens.inkSoft }}
                                            >
                                                No assessor score yet — this will show once an assessor submits one.
                                            </p>
                                        )}
                                        
                                        <p
                                            className="no-print text-xs text-center mt-4"
                                            style={{ fontFamily: "'IBM Plex Mono', monospace", color: tokens.inkSoft }}
                                        >
                                            {currentReflectionId
                                                ? "Loaded from the live server — updates when you save reflections or competency scores above."
                                                : "Updates live when you save reflections or competency scores above."}
                                        </p>
                                        {radarLoadError && (
                                            <p
                                                className="no-print text-xs text-center mt-1"
                                                style={{ fontFamily: "'IBM Plex Mono', monospace", color: tokens.wineDark }}
                                            >
                                                Could not refresh from the server: {radarLoadError}
                                            </p>
                                        )}
                                    </div>
                                </section>

                                {/* 05 — Pending Assessments (assessor-only) */}
                                {isAssessor && (
                                    <section ref={refMap.pending} className="mt-14 scroll-mt-10">
                                        <div className="flex items-center justify-between flex-wrap gap-2 mb-1">
                                            <SectionEyebrow no="05" label="Pending Assessments" accent={tokens.brass} accentDark={tokens.brassDark} />
                                            <button
                                                onClick={loadPendingReflections}
                                                className="no-print text-xs font-medium px-3 py-1.5 rounded-full transition hover:bg-black/5"
                                                style={{ backgroundColor: tokens.parchmentWarm, color: tokens.brassDark, border: `1px solid ${tokens.brass}` }}
                                            >
                                                {pendingLoading ? "Refreshing…" : "Refresh list"}
                                            </button>
                                        </div>
                                        <p className="text-sm mb-6" style={{ color: tokens.inkSoft }}>
                                            Every reflection you can see, so you know which ones still need your scores.
                                        </p>

                                        {pendingError && (
                                            <p
                                                className="text-xs mb-4"
                                                style={{ fontFamily: "'IBM Plex Mono', monospace", color: tokens.wineDark }}
                                            >
                                                Could not load the list: {pendingError}
                                            </p>
                                        )}

                                        {!pendingError && pendingLoading && pendingReflections.length === 0 && (
                                            <p className="text-sm" style={{ color: tokens.inkSoft }}>Loading…</p>
                                        )}

                                        {!pendingLoading && !pendingError && pendingReflections.length === 0 && (
                                            <p className="text-sm" style={{ color: tokens.inkSoft }}>
                                                No reflections found yet.
                                            </p>
                                        )}

                                        <div className="flex flex-col gap-3">
                                            {pendingReflections.map((r) => {
                                                const hasAssessment = r.assessment_status === "assessed";
                                                const studentLabel = r.user?.name || r.user?.email || r.user_id || "Unknown student";
                                                return (
                                                    <div
                                                        key={r.id}
                                                        className="rounded-lg p-4 flex items-center justify-between flex-wrap gap-3"
                                                        style={{ backgroundColor: tokens.parchmentWarm, border: `1px solid ${tokens.rule}` }}
                                                    >
                                                        <div>
                                                            <p className="text-sm font-medium" style={{ color: tokens.ink }}>
                                                                Reflection #{r.id} — {studentLabel}
                                                            </p>
                                                            <p className="text-xs mt-0.5" style={{ color: tokens.inkSoft, fontFamily: "'IBM Plex Mono', monospace" }}>
                                                                {r.comment ? r.comment.slice(0, 80) : "No written reflection"}
                                                            </p>
                                                        </div>
                                                        <div className="flex items-center gap-3">
                                                            <span
                                                                className="text-xs font-medium px-2.5 py-1 rounded-full"
                                                                style={
                                                                    hasAssessment
                                                                        ? { backgroundColor: "rgba(124,148,132,0.18)", color: tokens.sageDark }
                                                                        : { backgroundColor: "rgba(184,134,59,0.18)", color: tokens.brassDark }
                                                                }
                                                            >
                                                                {hasAssessment ? "Reviewed" : "Pending"}
                                                            </span>
                                                            <button
                                                                onClick={() => {
                                                                    setCurrentReflectionId(r.id);
                                                                    scrollTo("assessor");
                                                                }}
                                                                className="text-xs font-medium px-3 py-1.5 rounded-md transition hover:brightness-110"
                                                                style={{ backgroundColor: tokens.sageDark, color: tokens.parchmentWarm }}
                                                            >
                                                                Open to score
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </section>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render Component to DOM
        ReactDOM.createRoot(document.getElementById('root')).render(<ReflectionDiaryMockup />);
    </script>
</body>
</html>
